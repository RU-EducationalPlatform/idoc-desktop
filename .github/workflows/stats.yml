name: stats

# Rewrites the download table, the chart and the badge file from GitHub's own release counters (scripts/stats.mjs).
# Manual for now (see below). It commits only when a number changed, and uses nothing but the
# repository's own token: no secrets, no third-party actions.
on:
  # Manual only, for now: the count is mostly this project's own testing, so nothing is published or updated by itself.
  # To publish it again: put the two markers back in the README (scripts/stats.mjs) and restore the schedule and release triggers.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/stats.test.mjs
      - run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when a number changed
        run: |
          if git diff --quiet -- README.md stats; then echo "no change"; exit 0; fi
          git config user.name "idoc-stats"
          git config user.email "idoc-stats@users.noreply.github.com"
          git add README.md stats
          git commit -m "Download statistics"
          git push
