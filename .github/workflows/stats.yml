name: stats

# Rewrites the download table, the chart and the badge file from GitHub's own release counters (scripts/stats.mjs).
# Runs daily and whenever a release is published. It commits only when a number changed, and uses nothing but the
# repository's own token: no secrets, no third-party actions.
on:
  schedule:
    - cron: "17 5 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/stats.test.mjs
      - run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when a number changed
        run: |
          if git diff --quiet -- README.md stats; then echo "no change"; exit 0; fi
          git config user.name "idoc-stats"
          git config user.email "idoc-stats@users.noreply.github.com"
          git add README.md stats
          git commit -m "Download statistics"
          git push
